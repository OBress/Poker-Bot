[project]
name = "pokerbot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "OBress", email = "owen@bress.tv" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openai>=3.32.0",
    "phevaluator>=0.6.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pokerkit>=0.7.7",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
pokerbot = "pokerbot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:A card being dealt:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
