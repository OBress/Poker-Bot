# Duplicate benchmark against the fullhouse-engine reference bots (e-x.club Showdown).
#   uv run pokerbot eval duplicate --config configs/bench-fullhouse.yaml --hero <spec>
# Player specs: see src/pokerbot/eval/players.py. Until Phase 4 there is no baseline or exploiter,
# so the default hero is the calibrated TAG style; swap in baseline/exploiter specs when they exist.

hero: style:tag
reference: fullhouse:template   # the "unmodified template" submission, a floor to beat
opponents:                      # pool; each table draws seats - 1 of these
  - fullhouse:template
  - fullhouse:aggressor
  - fullhouse:mathematician
  - fullhouse:shark
  - fullhouse:ref_bot_2
seats: 6
seed: 20261029                  # development seed; not a test seed (AGENTS.md rule 2)
workers: 8
bots: profiles/bots-v2.json     # style:<name> players come from here

formats:
  cash:                         # stacks reset every hand: our clean win-rate measurement
    mode: cash
    sessions: 600               # multiple of seats so the hero sits in every seat equally
    hands: 500
    stack: 10000
    small_blind: 50
    big_blind: 100
    allin: true                 # expected value for all-in runouts (MATH.md §7.2)
  match:                        # their qualifier rules: 400 hands, stacks carry over, no rebuys
    mode: match
    sessions: 1200
    hands: 400
    stack: 10000
    small_blind: 50
    big_blind: 100
