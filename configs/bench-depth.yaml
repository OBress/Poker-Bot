# Does the 100 bb blueprint lose its edge at 200 bb? The same sessions (cards, seats, opponents)
# are played at both depths against the Phase 4 heuristic bots, heads-up. "reference" is only the
# required second player; read the hero's own bb/100 per opponent.
#   uv run pokerbot eval duplicate --config configs/bench-depth.yaml
# Post-hoc diagnostic for docs/results/slumbot.md; development seed, not a test seed.

hero: blueprint:profiles/blueprint-hu-v1.npz
reference: calling-station
opponents:
  - abc
  - hand-strength
seats: 2
rotate_hero: false
seed: 20261031
workers: 8
bots: profiles/bots-v3.json

formats:
  depth_100bb:
    mode: cash
    sessions: 400               # 200 per opponent
    hands: 500
    stack: 10000
    small_blind: 50
    big_blind: 100
    allin: true
  depth_200bb:
    mode: cash
    sessions: 400
    hands: 500
    stack: 20000
    small_blind: 50
    big_blind: 100
    allin: true
